[project]
name = "job-applier"
version = "0.1.0"
description = "Local-first job search: find matching roles, tailor applications, track the pipeline, prep for interviews."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Only needed to fill application forms. Everything else works without it.
# After installing: playwright install chromium
autofill = ["playwright>=1.40"]
# Use Google Gemini (free tier) instead of Anthropic for generation.
gemini = ["google-genai>=1.0"]

[project.scripts]
job-applier = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
